name: Copilot configuration

on:
  push:
    paths:
      - ".claude/agents/**"
      - ".claude/skills/**"
      - ".claude/rules/**"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".github/copilot-instructions.md"
      - ".github/workflows/copilot-config.yml"
      - ".vscode/settings.json"
      - "tools/sync_copilot.py"
      - "tools/test_sync_copilot.py"
      - "AGENTS.md"
  pull_request:
    paths:
      - ".claude/agents/**"
      - ".claude/skills/**"
      - ".claude/rules/**"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".github/copilot-instructions.md"
      - ".github/workflows/copilot-config.yml"
      - ".vscode/settings.json"
      - "tools/sync_copilot.py"
      - "tools/test_sync_copilot.py"
      - "AGENTS.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/sync_copilot.py --check
      - run: python -m unittest discover -s tools -p test_sync_copilot.py -v
